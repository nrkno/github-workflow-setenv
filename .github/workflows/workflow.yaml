name: GitHub Workflow - Setenv
on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runs on, e.g. ubuntu-latest"
        required: true
        type: string
      github-role-name:
        description: "The Vault role name for the github-app-role"
        required: true
        type: string
      role-name:
        description: "Vault app_role_applications name"
        required: true
        type: string
      vault-address:
        description: "Vault address, e.g. https://vault.some-domain.com"
        required: true
        type: string
      env:
        description: "Vault environment eg: prod"
        required: true
        type: string
      cluster:
        description: "Can be used multiple times, exported in KUBE_CONFIG_PATH: ~/.kube/atlantis/config"
        required: false
        type: string
        default: None
      azure:
        description: "Get Azure credentials, exported as ARM_CLIENT_ID and ARM_CLIENT_SECRET"
        required: false
        type: boolean
        default: false
      azure-tenant-id:
        description: "Azure tenant ID. Required if --azure is set"
        required: false
        type: string
        default: ""
      azure-subscription-id:
        description: "Azure subscription ID. Subscription ID for which your state is stored. Required if --azure is set"
        required: false
        type: string
        default: ""
      azure-resource-group:
        description: "Azure resource group name. Resource group for which your state is stored. Required if --azure is set"
        required: false
        type: string
        default: ""
      azure-no-arm:
        description: "Do not export ARM_CLIENT_ID and ARM_CLIENT_SECRET, only TF_VAR_azure_client_id and TF_VAR_azure_client_secret"
        required: false
        type: boolean
        default: false
      gcp:
        description: "GCP project names, creates TF_VAR_gcp_project_name for use in \"credentials\" in google provider"
        required: false
        type: string
        default: None
      terraform-registry:
        description: "Get Terraform registry token, expects to be found in vault under \"token\" in secret/applications/{name}/{env}/terraform-registry"
        required: false
        type: boolean
        default: false
      wait-time:
        description: "Time to wait in seconds after Azure credentials have been validated, defaults to 60"
        required: false
        type: string
      eval:
        description: "Output as export statements, for use with eval $()"
        required: false
        type: boolean
        default: false
      new-line:
        description: "Output as text separated by newline"
        required: false
        type: boolean
        default: false
      debug:
        description: "Print progress messages"
        required: false
        type: boolean
        default: false
      vault-role-id-name:
        description: "Name of the environment variable for Vault role ID, defaults to \"TF_VAR_vault_role_id\""
        required: false
        type: string
        default: "TF_VAR_vault_role_id"
      vault-secret-id-name:
        description: "Name of the environment variable for Vault secret ID, defaults to \"TF_VAR_vault_secret_id\""
        required: false
        type: string
        default: "TF_VAR_vault_secret_id"
      vault-secret-id-cidr:
        description: "CIDR to use for Vault secret ID, defaults to the IP address from --myip-url with /32 suffix"
        required: false
        type: string
        default: ""
      vault-wrap-secret-path:
        description: "Deprecated and unused. Kept so existing callers keep working."
        required: false
        type: string
      cache:
        description: "Cache/ use cached credentials"
        required: false
        type: boolean
        default: false
      cache-file:
        description: "Path and name to cache file, defaults to /tmp/{repo_name}_{workflow_name}.cache.json when running in atlantis, or /tmp/{current_workdir}.cache.json when running from shell"
        required: false
        type: string
        default: ""
      secret:
        description: "Every key/value pair in vault applications \"setenv\" secret is added to env vars"
        required: false
        type: boolean
        default: false
      vault-secret:
        description: "Get secret from vault, specify path to secret, key in secret and name of environment variable to export. Can be used multiple times, e.g. --vault-secret secret/applications/myapp/prod:mykey:MY_VAR_NAME. If using * as key, all keys in secret will be exported with the specified var_name as prefix, e.g.: --vault-secret secret/applications/myapp/prod:*:MY_PREFIX_ will export MY_PREFIX_key1, MY_PREFIX_key2 etc."
        required: false
        type: string
        default: None
      myip-url:
        description: "URL to get current IP address, default is https://icanhazip.com"
        required: false
        type: string
        default: "https://icanhazip.com"
      terraform_version:
        description: "Deprecated and unused. Kept so existing callers keep working."
        type: string
        default: "latest"
      wrap-ttl:
        description: "Lifetime in seconds of the Vault response-wrapping token that is handed to the caller"
        required: false
        type: string
        default: "300"
    outputs:
      setenv_outputs:
        description: "Outputs from the setenv action"
        value: ${{ jobs.setenv.outputs.wrap_token }}

jobs:
  setenv:
    name: Set environment variables from Vault
    runs-on: ${{ fromJson(inputs.runs-on) }}
    permissions:
      id-token: write
      contents: read
    outputs:
      wrap_token: ${{ toJson(steps.wrap_outputs.outputs.wrap_token) }}
    steps:
      - name: Vault login
        id: vault_login_github
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-address }}
          role: ${{ inputs.github-role-name }}-${{ inputs.env }}
          method: jwt
          path: jwt-github
          outputToken: true

      - name: Gather environment variables
        id: setenv
        # TODO(bump): security/sweep-2026-11 in github-action-setenv (masks values, rejects reserved
        # GITHUB_ENV keys, writes GITHUB_ENV safely) is unreleased. Pin the SHA of the next release.
        uses: nrkno/github-action-setenv@883dd4c164f4b6376f5bbe10ad19675d04fdc22b # v3.2.1
        env:
          VAULT_ADDR: ${{ inputs.vault-address }}
        with:
          name: ${{ inputs.role-name }}
          env: ${{ inputs.env }}
          cluster: ${{ inputs.cluster }}
          azure: ${{ inputs.azure }}
          azure_tenant_id: ${{ inputs.azure-tenant-id || '' }}
          azure_subscription_id: ${{ inputs.azure-subscription-id || '' }}
          azure_resource_group: ${{ inputs.azure-resource-group || '' }}
          azure_no_arm: ${{ inputs.azure-no-arm }}
          gcp: ${{ inputs.gcp }}
          terraform_registry: ${{ inputs.terraform-registry }}
          wait_time: ${{ inputs.wait-time }}
          eval: ${{ inputs.eval }}
          new_line: ${{ inputs.new-line }}
          debug: ${{ inputs.debug }}
          vault_role_id_name: ${{ inputs.vault-role-id-name || 'TF_VAR_vault_role_id' }}
          vault_secret_id_name: ${{ inputs.vault-secret-id-name || 'TF_VAR_vault_secret_id' }}
          vault_secret_id_cidr: ${{ inputs.vault-secret-id-cidr }}
          cache: ${{ inputs.cache }}
          cache_file: ${{ inputs.cache-file }}
          secret: ${{ inputs.secret }}
          vault_secret: ${{ inputs.vault-secret }}
          myip_url: ${{ inputs.myip-url }}
          token: ${{ steps.vault_login_github.outputs.vault_token }}

      - name: Wrap outputs in vault
        id: wrap_outputs
        env:
          VAULT_ADDR: ${{ inputs.vault-address }}
          VAULT_TOKEN: ${{ steps.vault_login_github.outputs.vault_token }}
          WRAP_TTL: ${{ inputs.wrap-ttl }}
          SETENV_OUTPUTS: ${{ toJson(steps.setenv.outputs) }}
        shell: bash
        run: |
          set -euo pipefail
          case "${WRAP_TTL}" in ''|*[!0-9]*) echo "::error::wrap-ttl must be a number of seconds" >&2; exit 1 ;; esac

          # Secrets never appear in the script text or in process arguments:
          # the payload goes through stdin, the token through a private header file.
          # Temp files live in the runner's per-job temp dir and are removed on exit.
          umask 077
          work_dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/wrap.XXXXXX")"
          trap 'rm -rf "${work_dir}"' EXIT
          header_file="${work_dir}/headers"
          response_file="${work_dir}/response"
          printf 'X-Vault-Token: %s\n' "${VAULT_TOKEN}" > "${header_file}"

          # No --fail-with-body (needs curl >= 7.76): write the body to a file and check the status.
          # curl's own error text never contains the payload or the token.
          curl_rc=0
          http_code="$(printf '%s' "${SETENV_OUTPUTS}" | curl --silent --show-error \
              --output "${response_file}" --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "@${header_file}" \
              --header "X-Vault-Wrap-TTL: ${WRAP_TTL}" \
              --data-binary @- \
              "${VAULT_ADDR}/v1/sys/wrapping/wrap")" || curl_rc=$?
          if [ "${curl_rc}" -ne 0 ]; then
            echo "::error::Vault wrap request failed (curl exit ${curl_rc})" >&2
            exit 1
          fi
          if [ "${http_code}" != "200" ]; then
            # Vault error bodies hold only {"errors":[...]}; print just that array and never the response otherwise.
            # CR and LF are replaced so the text cannot start a new workflow command.
            causes="$(jq -r '(.errors // []) | map(tostring) | join("; ") | gsub("[\r\n]"; " ")' "${response_file}" 2>/dev/null || true)"
            echo "::error::Vault wrap request returned HTTP ${http_code}: ${causes:-no error detail}" >&2
            exit 1
          fi

          wrap_token="$(jq -er '.wrap_info.token' "${response_file}")" || {
            echo "::error::Vault response had no wrap_info.token" >&2
            exit 1
          }
          echo "wrap_token=${wrap_token}" >> "${GITHUB_OUTPUT}"
